<script>
    setup({
        init: (self) =>
        {
            //console.log("init", HearSay.observedAttributes);

            self.refresh(self);
        },
        refresh: (self) =>
        {
            const propsArray = Array.from(self.props);

            console.log("atts changed", propsArray);

            const template = self.shadowRoot.querySelector("slot");
            const mroot = self.shadowRoot.querySelector("#mult-root");

            const els = propsArray.map((props, i) =>
            {
                const el = template.assignedElements()[0].cloneNode(true);
                el._props = JSON.stringify(props);
                el.setAttribute("index", i);
                el.component = self.component;
                Object.defineProperty(el, "index",
                {
                    get()
                    {
                        return Number(el.getAttribute("index"));
                    },
                    set(val)
                    {
                        el.setAttribute("index", val);
                    }
                });
                Promise.resolve().then(() => el?.refreshCallback());
                return el;

            } );

            mroot.replaceChildren(...els);
        },
        react: (self, data, recipient) =>
        {
            ;
        }
    });
</script>

<slot style="display: none"></slot>

<div id="mult-root"></div>
