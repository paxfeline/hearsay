<style>
.board-row:after {
  clear: both;
  content: '';
  display: table;
}
.status {
  margin-bottom: 10px;
}
</style>

<script>
    setup({
        init: self =>
        {
            console.log("board init")
            self.state = {turn: 'X', history: []};
            self.props.board = Array(9).fill(null);
            self.props.status = "Next player: X"
        },
        react: (self, data, recipient) =>
        {
            console.log(self, data, recipient);
            if (self.props.board[recipient]) return;
            self.props.board[recipient] = self.state.turn;
            self.state.history.push([...self.props.board]);
            self.state.turn = self.state.turn == 'X' ? 'O' : 'X';
            const winner = self.calculateWinner(self.props.board);
            let status;
            if (winner) {
                status = "Winner: " + winner;
            } else {
                status = "Next player: " + self.state.turn;
            }
            self.props.status = status;
        },
        calculateWinner: (squares) =>
        {
            const lines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            for (let i = 0; i < lines.length; i++) {
                const [a, b, c] = lines[i];
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                return squares[a];
                }
            }
            return null;
        }
    })
</script>

<div className="status">
    <j-s>
        self.component.props.status || ''
    </j-s>
</div>
