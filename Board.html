<style>
.board-row:after {
  clear: both;
  content: '';
  display: table;
}
.status {
  margin-bottom: 10px;
}
</style>

<script>
    setup({
        init: self =>
        {
            console.log("board init")
            self.props.board = Array(9).fill(null);
            self.props.status = "Next player: X"
            self.state = {turn: 0, history: [[...self.props.board]]};
        },
        react: (self, data, recipient) =>
        {
            console.log(self, data, recipient);
            if (data == "set")
            {
                if (self.props.board[recipient]) return;
                self.props.board[recipient] = self.state.turn % 2 == 0 ? "X" : "O";
                self.state.history.push([...self.props.board]);
                self.state.turn++;
                const winner = self.calculateWinner(self.props.board);
                let status;
                if (winner) {
                    status = "Winner: " + winner;
                } else {
                    status = "Next player: " + (self.state.turn % 2 == 0 ? "X" : "O");
                }
                console.log(status);
                self.props.status = status;
            }
            else if (data == "jump")
            {
                self.state.turn = recipient; // little hacky but hey
                self.props.board[recipient] = self.state.turn % 2 == 0 ? "X" : "O";
                self.props.board = [...self.state.history[self.state.turn]];
                self.state.history.length = self.state.turn + 1;
                const winner = self.calculateWinner(self.props.board);
                let status;
                if (winner) {
                    status = "Winner: " + winner;
                } else {
                    status = "Next player: " + (self.state.turn % 2 == 0 ? "X" : "O");
                }
                self.props.status = status;
            }
        },
        calculateWinner: (squares) =>
        {
            const lines = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            for (let i = 0; i < lines.length; i++) {
                const [a, b, c] = lines[i];
                if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                return squares[a];
                }
            }
            return null;
        }
    })
</script>

<div className="status">
    <j-s>
        self.component.props.status || ''
    </j-s>
</div>

<div class="board-row">
    <hear-say src="Square.html" props="self.component.props.board[0]" key="0"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[1]" key="1"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[2]" key="2"></hear-say>
</div>
<div class="board-row">
    <hear-say src="Square.html" props="self.component.props.board[3]" key="3"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[4]" key="4"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[5]" key="5"></hear-say>
</div>
<div class="board-row">
    <hear-say src="Square.html" props="self.component.props.board[6]" key="6"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[7]" key="7"></hear-say>
    <hear-say src="Square.html" props="self.component.props.board[8]" key="8"></hear-say>
</div>

<hear-say map props="self.component.state.history">
    <hear-say>
        <div>
            <button onclick="broadcast('jump', this.component.index)">
                Go to turn
                <j-s>
                    self.component.index
                </j-s>
            </button>
        </div>
    </hear-say>
</hear-say>
